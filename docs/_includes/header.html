<header class="site-header" role="banner">
  <div class="wrap nav-row">
    <button type="button" class="nav-toggle" data-nav-toggle
      aria-label="Open navigation menu" aria-controls="primary-nav" aria-expanded="false">
      <span class="nav-toggle-icon" aria-hidden="true">☰</span>
    </button>

    <a href="{{ '/' | relative_url }}" class="brand mono accent" aria-label="omo-skills — home">omo-skills</a>

    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <button type="button" class="nav-close" data-nav-toggle
        aria-label="Close navigation menu" aria-expanded="false">
        <span aria-hidden="true">×</span>
      </button>
      <ul class="nav-list">
        <li>
          <a href="{{ '/skills/' | relative_url }}"{% if page.url == '/skills/' %} class="active"{% endif %}>Skills</a>
        </li>
        <li>
          <a href="{{ '/workflow/' | relative_url }}"{% if page.url == '/workflow/' %} class="active"{% endif %}>Workflow</a>
        </li>
        <li>
          <a href="{{ '/install/' | relative_url }}"{% if page.url == '/install/' %} class="active"{% endif %}>Install</a>
        </li>
        <li>
          <a href="{{ '/maintenance/' | relative_url }}"{% if page.url == '/maintenance/' %} class="active"{% endif %}>Maintenance</a>
        </li>
        <li>
          <a href="{{ '/retired/' | relative_url }}"{% if page.url == '/retired/' %} class="active"{% endif %}>Retired</a>
        </li>
      </ul>
    </nav>

    <button type="button" class="cmd-k-trigger" data-cmd-k-open aria-label="Open command palette (⌘K)">
      <span class="cmd-k-trigger-label mono">Search</span>
      <kbd class="kbd-hint" aria-hidden="true">⌘K</kbd>
    </button>
  </div>
  <div class="nav-overlay" data-nav-toggle aria-hidden="true"></div>
</header>
