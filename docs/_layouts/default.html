<!DOCTYPE html>
<html lang="zh-CN" class="theme-A">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="dark light">

  <title>{{ page.title }} | {{ site.title }}</title>

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="theme-A">
  <a class="skip-link" href="#main">Skip to content</a>

  {% include header.html %}

  <main id="main" class="wrap" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include cmd-k.html %}

  <script src="{{ '/assets/js/cmd-k.js' | relative_url }}" defer></script>
</body>
</html>
