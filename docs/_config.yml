title: omo-skills
description: >-
  omo 适配的 Matt Pocock 工程 skill 仓库在线指南 —— 16 个采纳 skill、
  三 Agent 接力工作流、4 步安装与维护手册。
baseurl: "/omo-skills"
url: "https://meisijiya.github.io"
markdown: kramdown
highlighter: rouge
# Jekyll 3.10 (GH Pages) requires a theme to drive sass processing.
# Default minima is used; our assets/css/main.scss overrides minima's
# main.scss entirely (minima-overrides.scss resets all the variables
# and re-defines every selector). Theme layouts are ignored — we ship
# our own _layouts/default.html.
plugins:
  - jekyll-feed
sass:
  style: compressed
  # libsass-compatible load paths; @import resolves partials from _sass/.
  load_paths:
    - _sass
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - .sass-cache
  - _site
  - vendor
  - README.md
  - INSTALL.md
  - MAINTENANCE.md
permalink: pretty
